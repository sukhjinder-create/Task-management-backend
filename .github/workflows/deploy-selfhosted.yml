name: Deploy to production (self-hosted)

# Builds the image on GitHub's runners and publishes it to GitHub Container
# Registry, then the server only PULLS it. Previously the image was built on the
# production host itself — a 1-CPU box that also serves live traffic — which made
# deploys take 15+ minutes and did heavy work on the machine users depend on.
#
# Safety model — this pipeline is designed to never leave production broken:
#   1. Build and push happen BEFORE the server is touched. A build failure means
#      production is never modified at all.
#   2. Records the currently running image before switching.
#   3. Pulls the new image, restarts, and health-checks the app locally AND
#      through the public HTTPS endpoint.
#   4. If either check fails, rolls back to the previously running image.
#
# Requires repository secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER
# (GITHUB_TOKEN is provided automatically and is used to push to ghcr.io.)

on:
  push:
    # main only. This repo previously deployed from ai-platform-epic-a -- a
    # feature branch that became production by accident -- while main was the
    # default branch and sat eight commits behind. Two branches meant a push
    # could deploy, or silently do nothing, depending on which one you used,
    # and briefly meant every push ran two identical deploys. One branch, one
    # rule: what is on main is what is in production.
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    # Native arm64 runner (free for public repositories). The first attempt at
    # this pipeline built arm64 via QEMU emulation on an amd64 runner, which was
    # roughly an order of magnitude slower and failed. Building on the same
    # architecture as the production host removes the emulation entirely.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_name: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The image name must be lowercase: OCI/Docker reject uppercase in a
      # repository name, and this repo is "Task-management-backend". Using
      # github.repository verbatim made the build step fail instantly on an
      # invalid reference before any layers were built.
      - name: Set image name and tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately minimal: no `platforms:` (the runner is already arm64, so the
      # native build matches the production host) and no registry/gha cache. An
      # earlier version specified both and failed here, while the identical build
      # succeeds on the production host — so the extra machinery, not the
      # Dockerfile, was the problem. Layer caching can be reintroduced once this
      # is proven green.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.image }}:latest
          build-args: |
            INCLUDE_BROWSER=false
            INCLUDE_PG_CLIENT=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Application secrets ──────────────────────────────────────────────────
      # The move off Cloud Run left this behind. The old pipeline mapped every
      # application secret into the runtime; nothing replaced it, so RAZORPAY_*,
      # STRIPE_*, LIVEKIT_*, DEEPGRAM_API_KEY and TURN_* were simply absent from
      # the container and the features that depend on them were silently dead.
      #
      # This MERGES into the server's .env. A key is written only when the
      # matching repository secret is non-empty; every other line is left alone.
      # That direction matters: some values live only on the server and are not
      # in the GitHub vault, so a blanket overwrite would delete working
      # credentials. A secret that is unset in GitHub can never blank one out.
      #
      # Values are base64-encoded in transit so punctuation cannot break the
      # transfer, and only key NAMES are ever echoed.
      - name: Sync application secrets into the server .env
        id: envsync
        # Delivering credentials is a convenience; shipping the code is the job.
        # A fault here must never block a deploy or leave production on an old
        # image, so this step reports and moves on.
        continue-on-error: true
        env:
          # ── The application secrets this backend actually reads ──────────────
          #
          # This used to serialise the ENTIRE secret vault into one variable and
          # pipe it over SSH. That is indistinguishable from secret
          # exfiltration, and GitHub's scanner agrees -- it froze every run of
          # this workflow with "GitHub detected that this workflow file may be
          # malicious", conclusion `action_required` and ZERO jobs executed. The
          # reason appears only as a banner on the run's web page; the REST API
          # reports no rulesets, no environments, nothing pending, so from a
          # terminal the pipeline simply looks stuck. Two commits sat undeployed
          # for hours before anyone noticed.
          #
          # Naming each secret fixes the real problem too: the vault holds 30
          # entries and the app needs 20 of them, so a wholesale dump shipped
          # deploy credentials and dead keys to the runtime for no reason.
          #
          # Every name below was verified against a real `process.env` (or
          # config-module) read in this repository before being listed. Note
          # LIVEKIT_* are read through the `env` config object rather than
          # `process.env` directly, so a naive grep misses them -- they are
          # required by services/huddleMediaToken.service.js.
          #
          # DELIBERATELY ABSENT, and why:
          #   DEPLOY_SSH_KEY/HOST/USER, GCP_SA_KEY  deploy plumbing, not app config
          #   JWT_SECRET, DATABASE_URL              server-owned; the vault copies are
          #                                         stale and once broke production
          #   STRIPE_*                              a TEST key; delivering it made
          #                                         Stripe look configured and gave
          #                                         non-INR customers free paid plans
          #   FIREBASE_B64                          misnamed -- push.service.js reads
          #                                         FIREBASE_SERVICE_ACCOUNT_JSON/_B64,
          #                                         so this has never done anything
          #
          # Adding a secret to the vault now also requires adding it here. That
          # is the intended trade: explicit beats invisible. An earlier version
          # of this step guessed names copied from the dead Cloud Run pipeline
          # and silently shipped nothing, so the failure mode is real -- the
          # step therefore prints every name it delivers, and warns loudly when
          # it finds none.
          APP_SECRET_NAMES: >-
            ASANA_CLIENT_SECRET ATTENDANCE_SLACK_WEBHOOK_URL
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            DB_PASSWORD DEEPGRAM_API_KEY
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GROQ_API_KEY
            LIVEKIT_API_KEY LIVEKIT_API_SECRET LIVEKIT_URL
            R2_ACCOUNT_ID
            RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET
            SLACK_WEBHOOK_URL SUPABASE_SERVICE_KEY
            VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY
          ASANA_CLIENT_SECRET: ${{ secrets.ASANA_CLIENT_SECRET }}
          ATTENDANCE_SLACK_WEBHOOK_URL: ${{ secrets.ATTENDANCE_SLACK_WEBHOOK_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          # Non-secret runtime config, driven by repository *variables* rather
          # than secrets so turning payments on stays an explicit, visible
          # choice made in the GitHub UI. Unset = left exactly as-is on the box.
          # Variables are non-secret by definition, so enumerating them carries
          # none of the risk that enumerating the secret vault did.
          ALL_VARS: ${{ toJSON(vars) }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          umask 077

          # The old DENY list is gone: with an explicit allow-list above, a
          # secret is delivered only by being named, so exclusion needs no
          # mechanism. The reasoning behind each exclusion has moved to the
          # allow-list comment, where it stays next to the decision it explains.
          #
          # Two of those exclusions were paid for in outages and must not be
          # re-added casually. JWT_SECRET and DATABASE_URL are owned by the
          # SERVER: the vault's copies are stale (a development-fallback signing
          # key, and a Supabase host that went IPv6-only), and an earlier version
          # of this step wrote them over the working values until production
          # refused to boot. STRIPE_* is a TEST key with Stripe unused; because
          # ensureStripeConfigured() only checks that a key exists, delivering it
          # made Stripe look available and routed every non-INR customer to a
          # test-mode checkout that granted a paid plan with no money moving.

          # Take every non-empty allow-listed secret and repository variable,
          # minus anything containing a newline (env_file has no syntax for
          # those). Emits "NAME base64value" — names in the clear, values
          # encoded so punctuation survives the trip.
          {
            for name in $APP_SECRET_NAMES; do
              # Indirect expansion reads the value from this step's env, where
              # the secret was placed above. An unset or empty secret is skipped
              # so it can never blank a working key on the server.
              value="${!name-}"
              [ -n "$value" ] || continue
              # Skip multi-line values: env_file has no syntax for them.
              # NOTE: the pattern must be $'\n'. Writing *"$(printf '\n')"*
              # looks equivalent but is not -- command substitution strips
              # trailing newlines, so the pattern collapses to ** and matches
              # EVERY value, silently delivering nothing at all.
              case "$value" in *$'\n'*) continue ;; esac
              printf '%s %s\n' "$name" "$(printf '%s' "$value" | base64 -w0)"
            done
            printf '%s' "$ALL_VARS" | jq -r '
              to_entries[]
              | select(.value != null and .value != "")
              | select(.value | test("\n") | not)
              | "\(.key) \(.value | @base64)"'
          } > /tmp/envsync

          COUNT="$(wc -l < /tmp/envsync | tr -d ' ')"
          echo "found $COUNT deliverable value(s) in this repository:"
          cut -d' ' -f1 /tmp/envsync | sed 's/^/  - /'    # names only, never values

          if [ "$COUNT" = "0" ]; then
            echo "::warning::Nothing to deliver — the vault has no application secrets visible to this job, so the server .env is left untouched."
            exit 0
          fi

          scp -i ~/.ssh/deploy_key -o ConnectTimeout=20 /tmp/envsync "$USER@$HOST:/tmp/envsync"
          rm -f /tmp/envsync

          # Capture the remote output so a changed .env can force a recreate:
          # compose will not necessarily restart the container for an env_file
          # edit alone when the image tag is unchanged (a re-run of the same
          # commit), and new credentials are useless until the process restarts.
          OUT="$(ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          cd ~/app

          [ -f .env ] || : > .env

          # Backups live outside the git working tree so they are never staged.
          mkdir -p ~/.env-backups
          cp .env ~/.env-backups/"env.$(date -u +%Y%m%dT%H%M%SZ)"
          ls -1t ~/.env-backups/env.* 2>/dev/null | tail -n +11 | xargs -r rm -f

          # ADDITIVE ONLY. A key already present on the server is left exactly
          # as it is; only genuinely absent keys are written.
          #
          # The previous version updated a key whenever the vault value differed
          # from the server's, which is backwards: the server holds the values
          # that are actually working, and the vault holds older ones. It
          # replaced a live 65-character JWT_SECRET with a 22-character
          # development placeholder and a working pooler DATABASE_URL with a
          # dead host, and production stopped booting. Additive-only delivers
          # the credentials that are missing -- which was the whole point --
          # without ever being able to damage one that works.

          # The server's .env uses CRLF. Comparing or appending without
          # accounting for that made every existing key look different from its
          # vault copy (the trailing \r), so the old code rewrote all of them.
          if grep -q $'\r$' .env 2>/dev/null; then EOL=$'\r'; else EOL=''; fi

          # An append to a file whose last line has no newline would fuse onto
          # that line and corrupt both entries.
          if [ -s .env ] && [ -n "$(tail -c 1 .env)" ]; then
            printf '%s\n' "$EOL" >> .env
          fi

          added=0
          kept=0
          while read -r key b64; do
            [ -n "${key:-}" ] || continue

            if grep -q "^${key}=" .env 2>/dev/null; then
              kept=$((kept + 1))
              continue
            fi

            val="$(printf '%s' "$b64" | base64 -d)"
            printf '%s=%s%s\n' "$key" "$val" "$EOL" >> .env
            echo "  added $key"            # name only — never the value
            added=$((added + 1))
          done < /tmp/envsync

          changed=$added
          echo "$kept key(s) already set on the server were left untouched"

          rm -f /tmp/envsync
          chmod 600 .env
          echo "$changed key(s) changed; .env now has $(grep -c '=' .env) entries"
          REMOTE
          )"

          echo "$OUT"
          if echo "$OUT" | grep -qE '^[1-9][0-9]* key\(s\) changed'; then
            echo "env_changed=true" >> "$GITHUB_OUTPUT"
            echo "credentials changed — the app container will be force-recreated"
          else
            echo "env_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull image on server, restart, health-check, rollback on failure
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_REF: ghcr.io/${{ needs.build.outputs.image_name }}:${{ needs.build.outputs.image_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENV_CHANGED: ${{ steps.envsync.outputs.env_changed }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=20 "$USER@$HOST" \
            "IMAGE_REF='$IMAGE_REF' REGISTRY_USER='$REGISTRY_USER' REGISTRY_TOKEN='$REGISTRY_TOKEN' ENV_CHANGED='$ENV_CHANGED' BRANCH='$BRANCH' bash -s" <<'REMOTE'
          set -uo pipefail
          cd ~/app

          CONTAINER=app-app-1
          PREV_IMAGE="$(sudo docker inspect "$CONTAINER" --format '{{.Config.Image}}' 2>/dev/null || echo '')"
          echo "previously running image: ${PREV_IMAGE:-none}"

          echo "$REGISTRY_TOKEN" | sudo docker login ghcr.io -u "$REGISTRY_USER" --password-stdin >/dev/null 2>&1 \
            || { echo "registry login failed"; exit 1; }

          # Keep the working tree in sync for compose/config files (no build here).
          # Sync from the branch that triggered this deploy, so the files on
          # disk match the image being started. --ff-only keeps it non-
          # destructive: a divergence warns and is skipped rather than
          # discarding anything on the server.
          # The server was cloned single-branch and shallow, so it only knew
          # refs/remotes/origin/ai-platform-epic-a. Merging "origin/main" there
          # fails with "not a commit" and the sync is skipped -- silently, which
          # is how the files on disk drift from the image being started.
          # Widening the refspec makes any branch fetchable, and FETCH_HEAD is
          # used rather than a remote-tracking ref so this works on a shallow
          # clone that has never seen the branch before.
          SYNC_BRANCH="${BRANCH:-main}"
          git remote set-branches origin '*' 2>/dev/null || true
          if git fetch --depth=1 origin "$SYNC_BRANCH"; then
            # A deploy checkout mirrors the repository; it is not a place to
            # keep local edits. Untracked files (.env above all) are untouched.
            git reset --hard FETCH_HEAD >/dev/null               && echo "synced working tree to origin/$SYNC_BRANCH"               || echo "warning: could not reset working tree"
          else
            echo "warning: git sync skipped (fetch of $SYNC_BRANCH failed)"
          fi

          # Password signup now requires mailbox proof. Refuse the release if
          # production cannot deliver that email; otherwise every new account
          # would be correctly locked but unable to activate.
          sudo docker exec "$CONTAINER" node -e '
            const missing = ["SMTP_HOST", "SMTP_USER", "SMTP_PASS"]
              .filter((name) => !String(process.env[name] || "").trim());
            if (missing.length) {
              console.error(`missing required email configuration: ${missing.join(", ")}`);
              process.exit(1);
            }
            const nodemailer = require("nodemailer");
            const transport = nodemailer.createTransport({
              host: process.env.SMTP_HOST,
              port: Number(process.env.SMTP_PORT || 587),
              secure: process.env.SMTP_SECURE === "true",
              auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS },
            });
            transport.verify()
              .then(() => console.log("signup email delivery verified"))
              .catch((error) => {
                console.error(`signup email delivery failed: ${error.code || error.message}`);
                process.exitCode = 1;
              });
          ' || { echo "email configuration check failed; current image remains active"; exit 1; }

          # Install the email-identity schema before the image that requires it
          # is started. The SQL is additive and safe to re-run.
          IDENTITY_MIGRATION="migrations/20260824_signup_identity_assurance.sql"
          [ -f "$IDENTITY_MIGRATION" ] || { echo "missing migration: $IDENTITY_MIGRATION"; exit 1; }
          echo "applying $IDENTITY_MIGRATION ..."
          sudo docker exec -i "$CONTAINER" node -e '
            const { Pool } = require("pg");
            let sql = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { sql += chunk; });
            process.stdin.on("end", async () => {
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
              });
              try {
                await pool.query(sql);
                const check = await pool.query(`
                  SELECT
                    COUNT(*) FILTER (
                      WHERE table_schema = $1 AND table_name = $2
                        AND column_name IN ($3, $4)
                    )::int AS user_columns,
                    COUNT(*) FILTER (
                      WHERE table_schema = $1 AND table_name = $5
                        AND column_name IN ($6, $7)
                    )::int AS workspace_columns,
                    to_regclass($8) AS token_table,
                    (SELECT relrowsecurity FROM pg_class WHERE oid = $8::regclass) AS token_rls
                  FROM information_schema.columns`, [
                    "public", "users", "email_verified_at", "email_verification_method",
                    "workspaces", "signup_country_code", "signup_method",
                    "public.email_verification_tokens",
                  ]);
                const row = check.rows[0];
                if (row.user_columns !== 2 || row.workspace_columns !== 2 || !row.token_table || !row.token_rls) {
                  throw new Error("signup identity schema verification failed");
                }
                console.log("signup identity migration verified");
              } catch (error) {
                console.error("signup identity migration failed:", error.message);
                process.exitCode = 1;
              } finally {
                await pool.end();
              }
            });
          ' < "$IDENTITY_MIGRATION" || { echo "migration failed; current image remains active"; exit 1; }

          # This release adds only an idempotent partial index for expired
          # no-card trial reconciliation. Apply it through the already-running
          # container so DATABASE_URL never leaves the production host. A
          # failure stops before the image is changed, leaving current traffic
          # untouched; the SQL itself uses IF NOT EXISTS for safe re-runs.
          TRIAL_MIGRATION="migrations/20260813_no_card_trial_lifecycle.sql"
          [ -f "$TRIAL_MIGRATION" ] || { echo "missing migration: $TRIAL_MIGRATION"; exit 1; }
          echo "applying $TRIAL_MIGRATION ..."
          sudo docker exec -i app-app-1 node -e '
            const { Pool } = require("pg");
            let sql = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { sql += chunk; });
            process.stdin.on("end", async () => {
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
              });
              try {
                await pool.query(sql);
                const check = await pool.query(
                  "SELECT to_regclass($1) AS index_name",
                  ["public.idx_workspaces_unpaid_trial_expiry"]
                );
                if (!check.rows[0]?.index_name) throw new Error("trial expiry index verification failed");
                console.log("trial lifecycle migration verified");
              } catch (error) {
                console.error("trial lifecycle migration failed:", error.message);
                process.exitCode = 1;
              } finally {
                await pool.end();
              }
            });
          ' < "$TRIAL_MIGRATION" || { echo "migration failed; current image remains active"; exit 1; }

          # Add and backfill workspace scope on chat read markers before the
          # tenant-isolated unread query is deployed. Additive and idempotent.
          CHAT_TENANT_MIGRATION="migrations/20260813_chat_tenant_isolation.sql"
          [ -f "$CHAT_TENANT_MIGRATION" ] || { echo "missing migration: $CHAT_TENANT_MIGRATION"; exit 1; }
          echo "applying $CHAT_TENANT_MIGRATION ..."
          sudo docker exec -i app-app-1 node -e '
            const { Pool } = require("pg");
            let sql = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { sql += chunk; });
            process.stdin.on("end", async () => {
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
              });
              try {
                await pool.query(sql);
                const check = await pool.query(
                  `SELECT
                     EXISTS (
                       SELECT 1 FROM information_schema.columns
                       WHERE table_schema = $1
                         AND table_name = $2
                         AND column_name = $3
                     ) AS has_workspace_id,
                     to_regclass($4) AS index_name`,
                  ["public", "chat_channel_read_status", "workspace_id", "public.idx_ccrs_workspace_user"]
                );
                if (!check.rows[0]?.has_workspace_id || !check.rows[0]?.index_name) {
                  throw new Error("chat tenant isolation verification failed");
                }
                console.log("chat tenant isolation migration verified");
              } catch (error) {
                console.error("chat tenant isolation migration failed:", error.message);
                process.exitCode = 1;
              } finally {
                await pool.end();
              }
            });
          ' < "$CHAT_TENANT_MIGRATION" || { echo "migration failed; current image remains active"; exit 1; }

          # Install the additive Execution Assurance schema before the API that
          # reads it is started. Composite foreign keys enforce workspace
          # boundaries in the database as well as in application queries.
          ASSURANCE_MIGRATION="migrations/20260813b_execution_assurance.sql"
          [ -f "$ASSURANCE_MIGRATION" ] || { echo "missing migration: $ASSURANCE_MIGRATION"; exit 1; }
          echo "applying $ASSURANCE_MIGRATION ..."
          sudo docker exec -i app-app-1 node -e '
            const { Pool } = require("pg");
            let sql = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { sql += chunk; });
            process.stdin.on("end", async () => {
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
              });
              try {
                await pool.query(sql);
                const check = await pool.query(`
                  SELECT
                    to_regclass($1) AS evidence_table,
                    COUNT(*) FILTER (
                      WHERE table_name = $2
                        AND column_name IN ($3, $4, $5, $6, $7)
                    )::int AS outcome_columns,
                    EXISTS (
                      SELECT 1 FROM pg_constraint
                      WHERE conname = $8
                        AND conrelid = $9::regclass
                    ) AS has_tenant_goal_fk
                  FROM information_schema.columns
                  WHERE table_schema = $10
                `, [
                  "public.goal_assurance_evidence",
                  "okr_objectives",
                  "success_measure",
                  "target_date",
                  "primary_project_id",
                  "priority",
                  "evidence_requirements",
                  "goal_assurance_evidence_workspace_goal_fkey",
                  "public.goal_assurance_evidence",
                  "public",
                ]);
                const row = check.rows[0];
                if (!row?.evidence_table || row.outcome_columns !== 5 || !row.has_tenant_goal_fk) {
                  throw new Error("execution assurance schema verification failed");
                }
                console.log("execution assurance migration verified");
              } catch (error) {
                console.error("execution assurance migration failed:", error.message);
                process.exitCode = 1;
              } finally {
                await pool.end();
              }
            });
          ' < "$ASSURANCE_MIGRATION" || { echo "migration failed; current image remains active"; exit 1; }

          # Complete the workspace-facing assurance layers before the image that
          # queries them is started. The migration is additive and idempotent;
          # verification covers every new contract plus evidence idempotency.
          ASSURANCE_MOAT_MIGRATION="migrations/20260813c_enterprise_assurance_moat.sql"
          [ -f "$ASSURANCE_MOAT_MIGRATION" ] || { echo "missing migration: $ASSURANCE_MOAT_MIGRATION"; exit 1; }
          echo "applying $ASSURANCE_MOAT_MIGRATION ..."
          sudo docker exec -i app-app-1 node -e '
            const { Pool } = require("pg");
            let sql = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { sql += chunk; });
            process.stdin.on("end", async () => {
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL,
                ssl: { rejectUnauthorized: false },
              });
              try {
                await pool.query(sql);
                const tables = [
                  "assurance_workspace_policies",
                  "assurance_portfolios",
                  "assurance_portfolio_goals",
                  "assurance_goal_dependencies",
                  "assurance_approval_requests",
                  "assurance_state_snapshots",
                  "assurance_outcome_observations",
                  "assurance_memory_patterns",
                  "assurance_export_manifests",
                ];
                const check = await pool.query(
                  `SELECT
                     COUNT(*)::int AS table_count,
                     to_regclass($2) AS evidence_idempotency_index,
                     EXISTS (
                       SELECT 1 FROM information_schema.columns
                       WHERE table_schema=$3 AND table_name=$4 AND column_name=$5
                     ) AS has_source_provider,
                     EXISTS (
                       SELECT 1 FROM pg_constraint
                       WHERE conname=$6 AND conrelid=$7::regclass
                     ) AS has_tenant_user_fk
                   FROM information_schema.tables
                   WHERE table_schema=$3 AND table_name = ANY($1::text[])`,
                  [tables, "public.idx_goal_assurance_evidence_idempotency", "public", "goal_assurance_evidence", "source_provider", "assurance_approval_requested_by_workspace_fkey", "public.assurance_approval_requests"]
                );
                const row = check.rows[0];
                if (row.table_count !== tables.length || !row.evidence_idempotency_index || !row.has_source_provider || !row.has_tenant_user_fk) {
                  throw new Error("enterprise assurance moat schema verification failed");
                }
                console.log("enterprise assurance moat migration verified");
              } catch (error) {
                console.error("enterprise assurance moat migration failed:", error.message);
                process.exitCode = 1;
              } finally {
                await pool.end();
              }
            });
          ' < "$ASSURANCE_MOAT_MIGRATION" || { echo "migration failed; current image remains active"; exit 1; }

          # Install the additive verified decision-to-outcome records before the
          # API and executive summary v7 are started. Verification covers every
          # new tenant-scoped table, the policy extension, and receipt digest.
          DECISION_OUTCOME_MIGRATION="migrations/20260814_verified_decision_outcome_os.sql"
          [ -f "$DECISION_OUTCOME_MIGRATION" ] || { echo "missing migration: $DECISION_OUTCOME_MIGRATION"; exit 1; }
          echo "applying $DECISION_OUTCOME_MIGRATION ..."
          sudo docker exec -i app-app-1 node -e '
            const { Pool } = require("pg");
            let sql = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { sql += chunk; });
            process.stdin.on("end", async () => {
              const pool = new Pool({
                connectionString: process.env.DATABASE_URL,
                ssl: process.env.NODE_ENV === "production" ? { rejectUnauthorized: false } : false,
              });
              try {
                await pool.query(sql);
                const tables = [
                  "assurance_decisions",
                  "assurance_decision_reviews",
                  "assurance_experiments",
                  "assurance_scenario_analyses",
                  "assurance_policy_proposals",
                  "assurance_outcome_receipts",
                ];
                const check = await pool.query(
                  `SELECT
                     (SELECT COUNT(*)::int FROM information_schema.tables
                      WHERE table_schema=$1 AND table_name=ANY($2::text[])) AS table_count,
                     EXISTS (SELECT 1 FROM information_schema.columns
                      WHERE table_schema=$1 AND table_name=$3 AND column_name=$4) AS has_review_window,
                     EXISTS (SELECT 1 FROM pg_constraint
                      WHERE conname=$5 AND conrelid=$6::regclass) AS has_tenant_decision_fk,
                     EXISTS (SELECT 1 FROM pg_constraint
                      WHERE conname=$7 AND conrelid=$8::regclass) AS has_receipt_digest`,
                  [
                    "public", tables, "assurance_workspace_policies", "decision_review_days",
                    "assurance_decision_recorded_by_workspace_fkey", "public.assurance_decisions",
                    "assurance_receipt_digest_check", "public.assurance_outcome_receipts",
                  ]
                );
                const row = check.rows[0];
                if (row.table_count !== tables.length || !row.has_review_window || !row.has_tenant_decision_fk || !row.has_receipt_digest) {
                  throw new Error("verified decision-to-outcome schema verification failed");
                }
                console.log("verified decision-to-outcome migration verified");
              } catch (error) {
                console.error("verified decision-to-outcome migration failed:", error.message);
                process.exitCode = 1;
              } finally {
                await pool.end();
              }
            });
          ' < "$DECISION_OUTCOME_MIGRATION" || { echo "migration failed; current image remains active"; exit 1; }

          echo "pulling $IMAGE_REF ..."
          sudo docker pull "$IMAGE_REF" || { echo "image pull failed"; exit 1; }

          # A changed .env must reach the process. Compose does not reliably
          # recreate a container for an env_file edit when the image tag is
          # unchanged, so force it in that case — otherwise new credentials sit
          # on disk while the running process keeps the old (or missing) ones.
          RECREATE=""
          if [ "${ENV_CHANGED:-false}" = "true" ]; then
            RECREATE="--force-recreate"
            echo "credentials changed — forcing container recreate"
          fi

          run_with_image() {
            local img="$1"
            sudo IMAGE_REF="$img" docker compose -f docker-compose.prod.yml up -d --no-build $RECREATE app 2>&1 | tail -10
          }

          health_ok() {
            local code pub
            for i in $(seq 1 20); do
              code="$(sudo docker exec app-app-1 node -e "fetch('http://127.0.0.1:3000/livez').then(r=>{console.log(r.status);process.exit(0)}).catch(()=>{console.log('000');process.exit(0)})" 2>/dev/null | tail -1)"
              [ "$code" = "200" ] && break
              sleep 5
            done
            [ "$code" != "200" ] && { echo "LOCAL HEALTH FAILED ($code)"; return 1; }

            for i in $(seq 1 10); do
              pub="$(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://api.asystence.com/livez 2>/dev/null || echo 000)"
              [ "$pub" = "200" ] && break
              sleep 5
            done
            [ "$pub" != "200" ] && { echo "PUBLIC HEALTH FAILED ($pub)"; return 1; }

            echo "health checks passed (local=200 public=200)"
            return 0
          }

          run_with_image "$IMAGE_REF"
          if health_ok; then
            echo "DEPLOY SUCCEEDED: $IMAGE_REF"
            sudo docker image prune -f >/dev/null 2>&1 || true
            exit 0
          fi

          echo "!!! HEALTH CHECK FAILED — ROLLING BACK to ${PREV_IMAGE:-previous}"
          if [ -n "$PREV_IMAGE" ]; then
            run_with_image "$PREV_IMAGE"
            if health_ok; then
              echo "ROLLED BACK SUCCESSFULLY — production healthy on the previous image."
              exit 1
            fi
          fi
          echo "CRITICAL: rollback failed. Manual intervention required."
          exit 1
          REMOTE
