name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: asystence-backend

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/asystence-backend/asystence-api \
            --project asystence-backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy asystence-api \
            --image gcr.io/asystence-backend/asystence-api \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 100 \
            --concurrency 1000 \
            --timeout 3600 \
            --update-env-vars="NODE_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},JWT_EXPIRES_IN=7d,GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GOOGLE_CALLBACK_URL=https://asystence-api-616077735050.asia-south1.run.app/auth/google/callback,FRONTEND_URL=https://app.asystence.com,FRONTEND_BASE_URL=https://app.asystence.com,STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }},STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }},STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }},STRIPE_DEFAULT_CURRENCY=usd,PAYMENTS_PROVIDER=razorpay,TRIAL_SIGNUP_PAYMENT_PROVIDER=razorpay,RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }},RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }},RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }},API_PUBLIC_URL=https://asystence-api-616077735050.asia-south1.run.app,TRIAL_SIGNUP_REQUIRE_PAYMENT=true,TRIAL_SIGNUP_REQUIRE_STRIPE=true,TRIAL_SIGNUP_PLAN_SLUG=pro,TRIAL_SIGNUP_CURRENCY=inr,TRIAL_SIGNUP_VERIFICATION_AMOUNT=100,BILLING_SUCCESS_URL=https://app.asystence.com/billing/success?session_id={CHECKOUT_SESSION_ID},BILLING_CANCEL_URL=https://app.asystence.com/billing/cancel,BILLING_PORTAL_RETURN_URL=https://app.asystence.com/settings/billing,VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }},VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }},VAPID_EMAIL=mailto:sukhjinder@apyhub.com,SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }},ATTENDANCE_SLACK_WEBHOOK_URL=${{ secrets.ATTENDANCE_SLACK_WEBHOOK_URL }},AI_SERVICE_SECRET=super-secret-token,ASANA_CLIENT_ID=1213353392045175,ASANA_CLIENT_SECRET=${{ secrets.ASANA_CLIENT_SECRET }},ASANA_REDIRECT_URI=https://asystence-api-616077735050.asia-south1.run.app/oauth/asana/callback,DB_HOST=db.jygpfnpdphbnmysnyyww.supabase.co,DB_USER=postgres,DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=postgres,DB_PORT=5432,DB_SSL=true,LLM_PROVIDER=groq,GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},GROQ_MODEL=llama-3.3-70b-versatile,FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_B64 }},TURN_USERNAME=90eff811a2ab4378ce44a073,TURN_CREDENTIAL=o5zNWcUgun6vgsFg,APP_NAME=Asystence,APP_VERSION=1.0.23,APP_VERSION_CODE=24,APP_APK_URL=https://pub-5e8d0742f1224c3dbf01efc7851e96f5.r2.dev/asystence-android-1.0.23.apk,APP_APK_SHA256=C8E609DC1136BE5AD4AEB3A1905C18CD9A7B23480A15FB923E713CDC7FBB03A9,APP_RELEASE_NOTES=Android Huddle connected-state and portrait camera remediation,AI_SERVICE_URL=https://asystence-ai-616077735050.asia-south1.run.app/internal/chat-event,R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }},AWS_S3_BUCKET=asystence-app,AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }},AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }},AWS_CDN_URL=https://pub-5e8d0742f1224c3dbf01efc7851e96f5.r2.dev,SUPABASE_URL=https://jygpfnpdphbnmysnyyww.supabase.co,SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }},HUDDLE_MEDIA_PROVIDER=mesh,HUDDLE_MEDIA_FORCE_MESH=false,HUDDLE_FORCE_MESH=false,HUDDLE_LIVEKIT_FORCE_MESH=false,HUDDLE_LIVEKIT_ENABLED=true,HUDDLE_LIVEKIT_CANARY_ENABLED=true,HUDDLE_LIVEKIT_CANARY_WORKSPACES=*,HUDDLE_LIVEKIT_CANARY_SDK_LOAD_ENABLED=true,HUDDLE_LIVEKIT_CANARY_CONNECTIVITY_ENABLED=true,HUDDLE_LIVEKIT_ROOM_ENDPOINT_ENABLED=true,HUDDLE_LIVEKIT_TOKEN_ENDPOINT_ENABLED=true,HUDDLE_LIVEKIT_TOKEN_TTL_SECONDS=600,HUDDLE_LIVEKIT_ROLLOUT_ENABLED=true,HUDDLE_LIVEKIT_ROLLOUT_STAGE=stage_0_internal_only,LIVEKIT_URL=${{ secrets.LIVEKIT_URL }},LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }},LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }},HUDDLE_TRANSCRIPTION_ENABLED=true,HUDDLE_TRANSCRIPTION_PROVIDER=deepgram,HUDDLE_TRANSCRIPTION_MODEL=nova-3,HUDDLE_TRANSCRIPTION_LANGUAGE=multi,HUDDLE_TRANSCRIPTION_TOKEN_TTL_SECONDS=300,HUDDLE_TRANSCRIPTION_REQUIRE_CONSENT=false,HUDDLE_CAPTIONS_ENABLED=true,HUDDLE_TRANSCRIPT_ARTIFACTS_ENABLED=true,HUDDLE_INTELLIGENCE_WORKER_ENABLED=true,HUDDLE_INTELLIGENCE_WORKER_INTERVAL_MS=5000,HUDDLE_INTELLIGENCE_WORKER_BATCH_SIZE=10,HUDDLE_INTELLIGENCE_GENERATION_ENABLED=true,HUDDLE_INTELLIGENCE_GENERATION_WORKSPACES=3ff9264b-1a19-483a-b9e3-2a0b1840a1c2,HUDDLE_INTELLIGENCE_SUMMARY_ENABLED=true,HUDDLE_INTELLIGENCE_DECISIONS_ENABLED=true,HUDDLE_INTELLIGENCE_ACTION_ITEMS_ENABLED=true,HUDDLE_INTELLIGENCE_OWNERSHIP_ENABLED=true,HUDDLE_INTELLIGENCE_REQUIRE_AI_CONSENT=false,HUDDLE_INTELLIGENCE_MAX_TRANSCRIPT_CHARACTERS=120000,HUDDLE_INTELLIGENCE_MAX_OUTPUT_TOKENS=4800,DEEPGRAM_API_KEY=${{ secrets.DEEPGRAM_API_KEY }}" \
            --project asystence-backend

      - name: Route 100% traffic to latest revision
        run: |
          gcloud run services update-traffic asystence-api \
            --to-latest \
            --region asia-south1 \
            --project asystence-backend
