name: Deploy to Cloud Run (DEPRECATED)

# DEPRECATED — retained for reference only.
#
# Production moved off Google Cloud Run to a self-hosted server in July 2026
# after the GCP billing account was closed; that project can no longer deploy.
# The live pipeline is .github/workflows/deploy-selfhosted.yml.
#
# The automatic push trigger is disabled so this cannot fire and fail (or, if
# GCP billing were ever restored, silently deploy a second live backend
# alongside the self-hosted one). Manual dispatch is kept for the case where
# Cloud Run is deliberately brought back.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: asystence-backend

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="gcr.io/asystence-backend/asystence-api:${GITHUB_SHA}"
          gcloud builds submit \
            --tag "$IMAGE_TAG" \
            --project asystence-backend

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="gcr.io/asystence-backend/asystence-api:${GITHUB_SHA}"
          RELEASE_BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NON_SECRET_ENV_VARS="NODE_ENV=production,RELEASE_COMMIT=${GITHUB_SHA},RELEASE_BUILT_AT=${RELEASE_BUILT_AT},ADAPTIVE_RUNTIME_ENABLED=true,ADAPTIVE_RUNTIME_WORKER_ENABLED=true,ADAPTIVE_RUNTIME_WORKER_INTERVAL_MS=5000,ADAPTIVE_RUNTIME_WORKER_BATCH_SIZE=25,ADAPTIVE_RUNTIME_WORKER_CONCURRENCY=4,JWT_EXPIRES_IN=7d,GOOGLE_CALLBACK_URL=https://asystence-api-616077735050.asia-south1.run.app/auth/google/callback,FRONTEND_URL=https://app.asystence.com,FRONTEND_BASE_URL=https://app.asystence.com,CORS_ALLOWED_ORIGINS=https://app.asystence.com,STRIPE_DEFAULT_CURRENCY=usd,PAYMENTS_PROVIDER=razorpay,TRIAL_SIGNUP_PAYMENT_PROVIDER=razorpay,API_PUBLIC_URL=https://asystence-api-616077735050.asia-south1.run.app,TRIAL_SIGNUP_REQUIRE_PAYMENT=true,TRIAL_SIGNUP_REQUIRE_STRIPE=true,TRIAL_SIGNUP_PLAN_SLUG=pro,TRIAL_SIGNUP_CURRENCY=inr,TRIAL_SIGNUP_VERIFICATION_AMOUNT=100,BILLING_SUCCESS_URL=https://app.asystence.com/billing/success?session_id={CHECKOUT_SESSION_ID},BILLING_CANCEL_URL=https://app.asystence.com/billing/cancel,BILLING_PORTAL_RETURN_URL=https://app.asystence.com/settings/billing,VAPID_EMAIL=mailto:sukhjinder@apyhub.com,ASANA_REDIRECT_URI=https://asystence-api-616077735050.asia-south1.run.app/oauth/asana/callback,DB_HOST=db.jygpfnpdphbnmysnyyww.supabase.co,DB_USER=postgres,DB_NAME=postgres,DB_PORT=5432,DB_SSL=true,LLM_PROVIDER=groq,GROQ_MODEL=llama-3.3-70b-versatile,APP_NAME=Asystence,APP_VERSION=1.0.24,APP_VERSION_CODE=25,APP_APK_URL=https://pub-5e8d0742f1224c3dbf01efc7851e96f5.r2.dev/asystence-android-1.0.24.apk,APP_APK_SHA256=6FBD6AE415C8A243097692C67CBB15961B2B5422BBA3E9AFF020DEC218263643,APP_RELEASE_NOTES=Android Huddle portrait capture and framing remediation,AI_SERVICE_URL=https://asystence-ai-616077735050.asia-south1.run.app/internal/chat-event,AWS_S3_BUCKET=asystence-app,AWS_CDN_URL=https://pub-5e8d0742f1224c3dbf01efc7851e96f5.r2.dev,SUPABASE_URL=https://jygpfnpdphbnmysnyyww.supabase.co,HUDDLE_MEDIA_PROVIDER=mesh,HUDDLE_MEDIA_FORCE_MESH=false,HUDDLE_FORCE_MESH=false,HUDDLE_LIVEKIT_FORCE_MESH=false,HUDDLE_LIVEKIT_ENABLED=true,HUDDLE_LIVEKIT_CANARY_ENABLED=true,HUDDLE_LIVEKIT_CANARY_WORKSPACES=*,HUDDLE_LIVEKIT_CANARY_SDK_LOAD_ENABLED=true,HUDDLE_LIVEKIT_CANARY_CONNECTIVITY_ENABLED=true,HUDDLE_LIVEKIT_ROOM_ENDPOINT_ENABLED=true,HUDDLE_LIVEKIT_TOKEN_ENDPOINT_ENABLED=true,HUDDLE_LIVEKIT_TOKEN_TTL_SECONDS=600,HUDDLE_LIVEKIT_ROLLOUT_ENABLED=true,HUDDLE_LIVEKIT_ROLLOUT_STAGE=stage_0_internal_only,HUDDLE_TRANSCRIPTION_ENABLED=true,HUDDLE_TRANSCRIPTION_PROVIDER=deepgram,HUDDLE_TRANSCRIPTION_MODEL=nova-3,HUDDLE_TRANSCRIPTION_LANGUAGE=multi,HUDDLE_TRANSCRIPTION_TOKEN_TTL_SECONDS=300,HUDDLE_TRANSCRIPTION_REQUIRE_CONSENT=false,HUDDLE_CAPTIONS_ENABLED=true,HUDDLE_TRANSCRIPT_ARTIFACTS_ENABLED=true,HUDDLE_INTELLIGENCE_WORKER_ENABLED=true,HUDDLE_INTELLIGENCE_WORKER_INTERVAL_MS=5000,HUDDLE_INTELLIGENCE_WORKER_BATCH_SIZE=10,HUDDLE_INTELLIGENCE_GENERATION_ENABLED=true,HUDDLE_INTELLIGENCE_GENERATION_WORKSPACES=3ff9264b-1a19-483a-b9e3-2a0b1840a1c2,HUDDLE_INTELLIGENCE_SUMMARY_ENABLED=true,HUDDLE_INTELLIGENCE_DECISIONS_ENABLED=true,HUDDLE_INTELLIGENCE_ACTION_ITEMS_ENABLED=true,HUDDLE_INTELLIGENCE_OWNERSHIP_ENABLED=true,HUDDLE_INTELLIGENCE_REQUIRE_AI_CONSENT=false,HUDDLE_INTELLIGENCE_MAX_TRANSCRIPT_CHARACTERS=120000,HUDDLE_INTELLIGENCE_MAX_OUTPUT_TOKENS=4800"
          SECRET_ENV_VARS="DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,STRIPE_PUBLISHABLE_KEY=STRIPE_PUBLISHABLE_KEY:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET:latest,RAZORPAY_KEY_ID=RAZORPAY_KEY_ID:latest,RAZORPAY_KEY_SECRET=RAZORPAY_KEY_SECRET:latest,RAZORPAY_WEBHOOK_SECRET=RAZORPAY_WEBHOOK_SECRET:latest,VAPID_PUBLIC_KEY=VAPID_PUBLIC_KEY:latest,VAPID_PRIVATE_KEY=VAPID_PRIVATE_KEY:latest,SLACK_WEBHOOK_URL=SLACK_WEBHOOK_URL:latest,ATTENDANCE_SLACK_WEBHOOK_URL=ATTENDANCE_SLACK_WEBHOOK_URL:latest,AI_SERVICE_SECRET=AI_SERVICE_SECRET:latest,INTERNAL_SERVICE_SECRET=INTERNAL_SERVICE_SECRET:latest,ASANA_CLIENT_ID=ASANA_CLIENT_ID:latest,ASANA_CLIENT_SECRET=ASANA_CLIENT_SECRET:latest,DB_PASSWORD=DB_PASSWORD:latest,GROQ_API_KEY=GROQ_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_B64=FIREBASE_SERVICE_ACCOUNT_B64:latest,TURN_USERNAME=TURN_USERNAME:latest,TURN_CREDENTIAL=TURN_CREDENTIAL:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID:latest,AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,LIVEKIT_URL=LIVEKIT_URL:latest,LIVEKIT_API_KEY=LIVEKIT_API_KEY:latest,LIVEKIT_API_SECRET=LIVEKIT_API_SECRET:latest,DEEPGRAM_API_KEY=DEEPGRAM_API_KEY:latest"
          gcloud run deploy asystence-api \
            --image "$IMAGE_TAG" \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --no-cpu-throttling \
            --min-instances 1 \
            --max-instances 100 \
            --concurrency 1000 \
            --timeout 3600 \
            --set-env-vars="$NON_SECRET_ENV_VARS" \
            --set-secrets="$SECRET_ENV_VARS" \
            --project asystence-backend

      - name: Route 100% traffic to latest revision
        run: |
          gcloud run services update-traffic asystence-api \
            --to-latest \
            --region asia-south1 \
            --project asystence-backend

      - name: Set up Node.js for dashboard materialization
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize and verify dashboard intelligence history
        run: |
          export AI_SERVICE_SECRET="$(gcloud secrets versions access latest \
            --secret=AI_SERVICE_SECRET \
            --project=asystence-backend)"
          API_URL="$(gcloud run services describe asystence-api \
            --region asia-south1 \
            --project asystence-backend \
            --format='value(status.url)')"
          API_URL="$API_URL" node - <<'NODE'
          const endpoint = `${process.env.API_URL}/internal/dashboard-history/materialize`;
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "authorization": `Bearer ${process.env.AI_SERVICE_SECRET}`,
            },
            body: JSON.stringify({
              days: "all",
              maxAnchors: 96,
              windowDays: 30,
              verify: true,
              strict: true,
            }),
          });
          const text = await response.text();
          let payload = null;
          try {
            payload = JSON.parse(text);
          } catch {
            console.error(text.slice(0, 4000));
            process.exit(1);
          }
          const summary = {
            status: payload.status,
            workspaceCount: payload.result?.workspaceCount || 0,
            verificationStatus: payload.verification?.status || null,
            checkedWorkspaceCount: payload.verification?.checkedWorkspaceCount || 0,
            failures: (payload.verification?.failures || []).slice(0, 10),
          };
          console.log(JSON.stringify(summary, null, 2));
          if (!response.ok || summary.failures.length > 0) {
            process.exit(1);
          }
          NODE
