name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: asystence-backend

      - name: Build and push Docker image
        run: |
          gcloud builds submit \
            --tag gcr.io/asystence-backend/asystence-api \
            --project asystence-backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy asystence-api \
            --image gcr.io/asystence-backend/asystence-api \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated \
            --port 3000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 100 \
            --concurrency 1000 \
            --timeout 3600 \
            --set-env-vars="NODE_ENV=production,DATABASE_URL=${{ secrets.DATABASE_URL }},JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GOOGLE_CALLBACK_URL=https://asystence-api-616077735050.asia-south1.run.app/auth/google/callback,FRONTEND_URL=https://www.asystence.com,FRONTEND_BASE_URL=https://www.asystence.com,VAPID_PUBLIC_KEY=${{ secrets.VAPID_PUBLIC_KEY }},VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }},VAPID_EMAIL=mailto:sukhjinder@apyhub.com,SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }},AI_SERVICE_SECRET=super-secret-token,ASANA_CLIENT_ID=1213353392045175,ASANA_CLIENT_SECRET=${{ secrets.ASANA_CLIENT_SECRET }},ASANA_REDIRECT_URI=https://asystence-api-616077735050.asia-south1.run.app/oauth/asana/callback,DB_HOST=db.jygpfnpdphbnmysnyyww.supabase.co,DB_USER=postgres,DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=postgres,DB_PORT=5432,DB_SSL=true,JWT_EXPIRES_IN=7d,LLM_PROVIDER=local,OLLAMA_NUM_GPU=0" \
            --project asystence-backend
