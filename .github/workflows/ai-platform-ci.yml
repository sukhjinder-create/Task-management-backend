name: Enterprise regression gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: enterprise-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Block committed credentials
        run: npm run security:secrets
      - name: Syntax check
        run: find . -path './node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full backend regression suite
        run: npm test
      - name: Block high and critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag asystence-api:${{ github.sha }} .
