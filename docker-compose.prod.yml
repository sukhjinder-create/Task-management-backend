# Production stack for a self-hosted server (e.g. Oracle Ampere / any VM).
# Caddy terminates HTTPS (automatic Let's Encrypt certificates) and reverse-proxies
# to the Node app. The database is external (Supabase) and is configured via .env.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# To enable the heavy optional features later (you have the RAM on a 12GB box),
# flip the build args below to "true" and re-run the command above.

# Container logs are rotated (capped at max-size × max-file per container) so a
# chatty or looping process can never fill the disk and take the host down.
# Docker's default is unlimited, which is a latent outage risk.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: .
      args:
        INCLUDE_BROWSER: "false"      # "true" bundles the Testing Agent browser (Playwright)
        INCLUDE_PG_CLIENT: "true"     # ships pg_dump/psql for the built-in DB backup + recovery
    restart: always
    env_file: .env
    expose:
      - "3000"
    networks: [web]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [web]
    logging: *default-logging

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
