name: asystence_mobile
description: Native Flutter mobile app for the Asystence task management platform.
publish_to: "none"
version: 1.0.18+19

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker:
    path: vendor/file_picker
  flutter_markdown: ^0.7.4
  flutter_secure_storage: ^10.3.1
  http: ^1.2.2
  intl: ^0.20.2
  app_links: ^6.4.1
  package_info_plus: ^8.3.0
  shared_preferences: ^2.3.3
  socket_io_client: ^3.0.2
  url_launcher: ^6.3.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_webrtc: 1.4.0
  livekit_client: 2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/asystence-logo.png
